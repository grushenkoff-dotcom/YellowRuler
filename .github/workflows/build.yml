name: Build Yellow Ruler IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build
        run: |
          xcodebuild \
            -project YellowRuler.xcodeproj \
            -scheme YellowRuler \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/YellowRuler.app Payload/
          zip -qry YellowRuler-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YellowRuler-IPA
          path: YellowRuler-unsigned.ipa
